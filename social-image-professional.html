<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prosper ISD Petition - Professional Social Media Image</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f5f5;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  
  .social-card {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    display: flex;
    flex-direction: column;
    padding: 70px;
    text-align: center;
    position: relative;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
  }
  
  .top-badge {
    background: #fbbf24;
    color: #1e3a8a;
    font-size: 36px;
    font-weight: 900;
    padding: 18px 50px;
    border-radius: 50px;
    display: inline-block;
    margin: 0 auto 50px;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 8px 20px rgba(251, 191, 36, 0.4);
  }
  
  .headline {
    font-size: 68px;
    font-weight: 900;
    color: white;
    line-height: 1.15;
    margin-bottom: 50px;
    letter-spacing: -1px;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
  }
  
  .highlight-word {
    color: #fbbf24;
  }
  
  .stats-container {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin-bottom: 50px;
    padding: 40px 0;
  }
  
  .stat-box {
    flex: 1;
    max-width: 400px;
  }
  
  .stat-number {
    font-size: 84px;
    font-weight: 900;
    color: #fbbf24;
    line-height: 1;
    margin-bottom: 12px;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
  }
  
  .stat-label {
    font-size: 32px;
    font-weight: 600;
    color: white;
    line-height: 1.3;
  }
  
  .divider {
    width: 120px;
    height: 6px;
    background: #fbbf24;
    margin: 0 auto 50px;
    border-radius: 3px;
  }
  
  .cta-section {
    margin-top: auto;
    margin-bottom: 40px;
  }
  
  .cta-text {
    font-size: 44px;
    font-weight: 700;
    color: white;
    line-height: 1.4;
    margin-bottom: 35px;
  }
  
  .cta-bold {
    font-weight: 900;
    color: #fbbf24;
    font-size: 48px;
  }
  
  .url-section {
    background: white;
    padding: 35px 50px;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }
  
  .url-label {
    font-size: 28px;
    font-weight: 700;
    color: #1e3a8a;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .url {
    font-size: 62px;
    font-weight: 900;
    color: #1e3a8a;
    letter-spacing: -1px;
  }
</style>
</head>
<body>

<div class="social-card">
  
  <div class="top-badge">Take Action Now</div>
  
  <div class="headline">
    Annex <span class="highlight-word">a Small Section</span><br>
    of Windsong Ranch<br>
    into <span class="highlight-word">Prosper ISD</span>
  </div>
  
  <div class="stats-container">
    <div class="stat-box">
      <div class="stat-number">~274</div>
      <div class="stat-label">Students attend<br>PISD via CONTRACT</div>
    </div>
    <div class="stat-box">
      <div class="stat-number">$6.2M</div>
      <div class="stat-label">Annual revenue<br>gain to PISD</div>
    </div>
  </div>
  
  <div class="divider"></div>
  
  <div class="cta-section">
    <div class="cta-text">
      Tell Both Boards to<br>
      <span class="cta-bold">Vote to Approve<br>Annexation/Detachment</span>
    </div>
  </div>
  
  <div class="url-section">
    <div class="url-label">Learn More →</div>
    <div class="url">prosperisdpetition.com</div>
  </div>
  
</div>

</body>
</html>
