<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prosper ISD Petition - Social Media Image</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f5f5;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  
  .social-card {
    width: 1080px;
    height: 1080px;
    background: #1e3a8a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px;
    text-align: center;
    position: relative;
  }
  
  .headline {
    font-size: 72px;
    font-weight: 900;
    color: #fbbf24;
    line-height: 1.2;
    margin-bottom: 60px;
    text-transform: uppercase;
    letter-spacing: -1px;
  }
  
  .body-text {
    font-size: 48px;
    font-weight: 600;
    color: white;
    line-height: 1.5;
    margin-bottom: 60px;
  }
  
  .highlight {
    color: #fbbf24;
    font-weight: 900;
  }
  
  .cta {
    font-size: 52px;
    font-weight: 900;
    color: #fbbf24;
    line-height: 1.3;
    margin-bottom: 50px;
    text-transform: uppercase;
  }
  
  .url-section {
    position: absolute;
    bottom: 60px;
    left: 80px;
    right: 80px;
    background: white;
    padding: 30px 40px;
    border-radius: 12px;
  }
  
  .url {
    font-size: 58px;
    font-weight: 900;
    color: #1e3a8a;
    letter-spacing: -1px;
  }
</style>
</head>
<body>

<div class="social-card">
  <div class="headline">
    Annex Small Section<br>of Windsong Ranch<br>into Prosper ISD
  </div>
  
  <div class="body-text">
    <span class="highlight">~274 Students</span> attend PISD<br>via CONTRACT today<br><br>
    PISD loses <span class="highlight">$6.2M annually</span><br>to Denton ISD
  </div>
  
  <div class="cta">
    Tell Both Boards to<br>Vote to Approve<br>Annexation/Detachment<br><br>Learn More:
  </div>
  
  <div class="url-section">
    <div class="url">prosperisdpetition.com</div>
  </div>
</div>

</body>
</html>
